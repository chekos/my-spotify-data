name: Check Spotify authentication

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
  SPOTIFY_AUTH_STRING: ${{ secrets.SPOTIFY_AUTH_STRING }}
  SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
  REDIRECT_URI: ${{ secrets.REDIRECT_URI }}

jobs:
  force-auth:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repo
      uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: pip
    - name: Install python dependencies
      run: |-
        pip install -r requirements.txt
    - name: Ensure auth works
      run: |
        python scripts/check_spotify_auth.py --public-config spotify-public-config.json
    - name: Upload public OAuth configuration for recovery
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: spotify-public-config
        path: spotify-public-config.json
        retention-days: 1
    - name: Get tracks played in the last hour
      run: |-
        esporifai get-recently-played before "$(date +"%Y-%m-%d %T")" --limit 5 --time-zone UTC --output -
